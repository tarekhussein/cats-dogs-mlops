name: Cats vs Dogs CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: API Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt

      - name: Run API tests
        run: |
          python -m pytest -v tests/

  docker:
    name: Docker Build and Health Check
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build CI Docker image
        run: |
          docker build \
            -f Dockerfile.ci \
            -t cats-dogs-api:ci .

      - name: Start container
        run: |
          docker run -d \
            --name cats-dogs-ci-test \
            -p 8002:8000 \
            cats-dogs-api:ci

      - name: Verify API health
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8002/health \
              | python -c "import json,sys; d=json.load(sys.stdin); assert d['status']=='healthy' and d['model_loaded'] is True"; then
              echo "Docker API health check passed"
              exit 0
            fi
            sleep 2
          done
          docker logs cats-dogs-ci-test
          exit 1

      - name: Install smoke test dependencies
        run: |
          python -m pip install pillow

      - name: Verify inference and monitoring
        run: |
          python scripts/smoke_test_ci.py

      - name: Show container logs
        if: always()
        run: docker logs cats-dogs-ci-test || true
