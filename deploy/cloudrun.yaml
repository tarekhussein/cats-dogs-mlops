apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: cats-dogs-api
  annotations:
    run.googleapis.com/ingress: internal
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "1"
    spec:
      containerConcurrency: 1
      timeoutSeconds: 60
      containers:
        - image: IMAGE_URI_TO_BE_SET_AT_DEPLOYMENT
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
          env:
            - name: PORT
              value: "8080"
